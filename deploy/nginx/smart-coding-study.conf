# Smart Coding Study — web + API cùng một origin (http://<ip>:8090), không cần CORS.
# Cài vào /etc/nginx/sites-enabled/smart-coding-study.conf bởi deploy/deploy.sh.

server {
    listen 8090;
    listen [::]:8090;
    server_name _;

    # Backend chặn body > 64KB (MAX_BODY_BYTES); nginx để rộng hơn chút để chính backend trả 413.
    client_max_body_size 80k;

    # nginx.conf của máy chưa bật gzip_types; bật riêng cho site này (main.dart.js vài MB).
    gzip on;
    gzip_types application/javascript text/css application/json application/wasm image/svg+xml;
    gzip_min_length 1024;

    # API: chỉ đúng hai route của backend.
    location = /content {
        proxy_pass http://127.0.0.1:8100;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 15s;
    }
    location = /run {
        proxy_pass http://127.0.0.1:8100;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Judge0 có thể mất tới 15s (HTTP timeout của runner); app chờ tối đa 20s.
        proxy_read_timeout 18s;
    }

    # Web Flutter (build/web).
    root /opt/smart-coding-study/web;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }
    # index.html và service worker không cache để bản deploy mới có hiệu lực ngay.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
    location = /flutter_service_worker.js {
        add_header Cache-Control "no-cache";
    }
}
