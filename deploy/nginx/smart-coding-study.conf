# Smart Coding Study — web + API cùng một origin https://codewithphuong.jacons-corp.com (không cần CORS;
# iOS bắt buộc HTTPS). Cài vào /etc/nginx/sites-enabled/smart-coding-study.conf bởi deploy/deploy.sh.
# Cert: `certbot certonly --nginx -d codewithphuong.jacons-corp.com` (một lần; certbot.timer tự gia hạn,
# installer=nginx nên certbot tự reload nginx sau khi gia hạn — như mọi site khác trên VPS).
# VPS dùng chung: file này chỉ khai server của app này.

# Link cũ http://<ip>:8090 → domain HTTPS. 308 (không phải 301): giữ nguyên method/body của POST /run, /api/*.
server {
    listen 8090;
    listen [::]:8090;
    server_name _;
    return 308 https://codewithphuong.jacons-corp.com$request_uri;
}

server {
    listen 80;
    listen [::]:80;
    server_name codewithphuong.jacons-corp.com;
    return 308 https://codewithphuong.jacons-corp.com$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name codewithphuong.jacons-corp.com;

    ssl_certificate /etc/letsencrypt/live/codewithphuong.jacons-corp.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/codewithphuong.jacons-corp.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Backend chặn body > 64KB (MAX_BODY_BYTES); nginx để rộng hơn chút để chính backend trả 413.
    client_max_body_size 80k;

    # nginx.conf của máy chưa bật gzip_types; bật riêng cho site này (main.dart.js vài MB).
    gzip on;
    gzip_types application/javascript text/css application/json application/wasm image/svg+xml;
    gzip_min_length 1024;

    # API: /content, /run (công khai) và /api/* (đăng nhập, tiến độ, quản trị — backend tự kiểm quyền).
    location = /content {
        proxy_pass http://127.0.0.1:8100;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 15s;
    }
    location = /run {
        proxy_pass http://127.0.0.1:8100;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Judge0 có thể mất tới 15s (HTTP timeout của runner); app chờ tối đa 20s.
        proxy_read_timeout 18s;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8100;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 15s;
    }
    # Admin gửi cả bộ nội dung khi kiểm tra/lưu: backend cho 4MB (MAX_ADMIN_BODY_BYTES).
    location /api/admin/ {
        client_max_body_size 4200k;
        proxy_pass http://127.0.0.1:8100;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # MCP cho claude.ai: /mcp (POST JSON, stateless) và discovery OAuth. Nginx cho 2MB (tài liệu SD tới 1MB,
    # JSON bọc quanh có thể lớn hơn); trần thật do backend quyết (MCP hiện còn 64KB — phải nâng cùng lúc).
    # Discovery phải có ^~ để không rơi vào location / (SPA try_files).
    location = /mcp {
        client_max_body_size 2100k;
        proxy_pass http://127.0.0.1:8100;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 30s;
    }
    location ^~ /.well-known/oauth-protected-resource {
        proxy_pass http://127.0.0.1:8100;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Web Flutter (build/web).
    root /opt/smart-coding-study/web;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }
    # index.html và service worker không cache để bản deploy mới có hiệu lực ngay.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
    location = /flutter_service_worker.js {
        add_header Cache-Control "no-cache";
    }
}
