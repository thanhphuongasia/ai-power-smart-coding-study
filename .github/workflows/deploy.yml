name: Deploy VPS

on:
  push:
    branches: [main]
  workflow_dispatch:

# Hai deploy chồng nhau sẽ giẫm lên /opt/smart-coding-study: xếp hàng, không huỷ giữa chừng.
concurrency:
  group: deploy-vps
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.9
          channel: stable
          cache: true

      # Secrets: VPS_HOST, VPS_USER, VPS_SSH_KEY (private key riêng cho deploy), VPS_KNOWN_HOSTS
      # (kết quả `ssh-keyscan <host>`, ghim host key để không bị MITM lần đầu kết nối).
      - name: Cấu hình SSH tới VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/deploy_key
          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/deploy_key ~/.ssh/known_hosts
          printf 'Host vps\n  HostName %s\n  User %s\n  IdentityFile ~/.ssh/deploy_key\n  IdentitiesOnly yes\n  StrictHostKeyChecking yes\n' "$VPS_HOST" "$VPS_USER" > ~/.ssh/config

      - name: Deploy
        run: deploy/deploy.sh
